<svg role="img" viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>TraceCite Mobile Architecture</title>
  <desc>Four-layer architecture on top of TraceCite Core</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect x="20" y="15" width="640" height="355" rx="16" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Device Layer -->
  <rect x="60" y="40" width="560" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="80" y="65" font-size="13" fill="#0C447C" font-weight="500">Device Layer</text>
  <rect x="280" y="48" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="315" y="70" text-anchor="middle" font-size="12" fill="#378ADD" font-weight="500">iOS</text>
  <rect x="360" y="48" width="90" height="44" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="405" y="70" text-anchor="middle" font-size="12" fill="#378ADD" font-weight="500">Android</text>
  <rect x="460" y="48" width="145" height="44" rx="6" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="532" y="70" text-anchor="middle" font-size="12" fill="#378ADD" font-weight="500">Sessions + Traces</text>

  <!-- Analysis Layer -->
  <rect x="60" y="115" width="560" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="80" y="140" font-size="13" fill="#085041" font-weight="500">Analysis Layer</text>
  <rect x="280" y="123" width="85" height="44" rx="6" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="322" y="145" text-anchor="middle" font-size="12" fill="#1D9E75" font-weight="500">Filter</text>
  <rect x="375" y="123" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="425" y="145" text-anchor="middle" font-size="12" fill="#1D9E75" font-weight="500">Behavior</text>
  <rect x="485" y="123" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="545" y="145" text-anchor="middle" font-size="12" fill="#1D9E75" font-weight="500">Scenario + Assert</text>

  <!-- Knowledge Layer -->
  <rect x="60" y="190" width="560" height="60" rx="10" fill="#FAECEA" stroke="#D85A30" stroke-width="0.5"/>
  <text x="80" y="215" font-size="13" fill="#993C1D" font-weight="500">Knowledge Layer</text>
  <rect x="280" y="198" width="85" height="44" rx="6" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="322" y="220" text-anchor="middle" font-size="12" fill="#D85A30" font-weight="500">Presets</text>
  <rect x="375" y="198" width="85" height="44" rx="6" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="417" y="220" text-anchor="middle" font-size="12" fill="#D85A30" font-weight="500">Markers</text>
  <rect x="470" y="198" width="135" height="44" rx="6" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="537" y="220" text-anchor="middle" font-size="12" fill="#D85A30" font-weight="500">Auto-grow</text>

  <!-- Plugin Layer -->
  <rect x="60" y="265" width="560" height="45" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="80" y="288" font-size="13" fill="#3C3489" font-weight="500">Plugin Layer</text>
  <text x="340" y="288" text-anchor="middle" font-size="11" fill="#7F77DD" font-weight="400">Parsers · Assertions · Reports · Backends</text>

  <!-- Core -->
  <rect x="60" y="322" width="560" height="35" rx="10" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="80" y="340" font-size="12" fill="#5F5E5A" font-weight="500">tracecite-core</text>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#888780" font-weight="400">Split · Match · Filter · Events · Run</text>
</svg>