name: Publish tracecite-mobile v0.1.0 to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    if: github.event.release.tag_name == 'v0.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify package name and version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          if project["name"] != "tracecite-mobile":
              raise SystemExit(f"Expected project name tracecite-mobile, got {project['name']}")
          if project["version"] != "0.1.0":
              raise SystemExit(f"Expected project version 0.1.0, got {project['version']}")
          PY

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event.release.tag_name == 'v0.1.0'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tracecite-mobile/0.1.0/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
