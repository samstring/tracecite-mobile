name: Agent Host Smoke

on:
  push:
    branches:
      - feature_for_agent
  pull_request:

jobs:
  agent-host-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install branch-aligned TraceCite stack
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/samstring/tracecite-core.git@feature_for_agent"
          python -m pip install "git+https://github.com/samstring/tracecite-mcp.git@feature_for_agent"
          python -m pip install -e ".[dev]"

      - name: Import all Agent-facing packages together
        run: |
          python - <<'PY'
          import tracecite
          import tracecite_mcp
          import tracecite_mobile
          print(tracecite.__name__, tracecite_mcp.__name__, tracecite_mobile.__name__)
          PY

      - name: Run Mobile Agent host smoke
        run: python scripts/agent_host_smoke.py

      - name: Run Agent contract tests
        run: |
          python -m pytest -q \
            tests/test_extension_registration.py \
            tests/test_agent_capabilities.py \
            tests/test_source_session_adapter.py \
            tests/test_skills.py
