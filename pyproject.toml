[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite-mobile"
version = "0.1.0"
description = "iOS and Android evidence collection and analysis workflows for agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TraceCite Contributors" }]
keywords = ["ios", "android", "logging", "agents", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = [
  "tracecite>=0.1.0,<0.2.0",
]

[project.entry-points."tracecite.extensions"]
mobile = "tracecite_mobile.extension"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=7"]

[project.scripts]
tracecite-mobile = "tracecite_mobile.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracecite_mobile*"]

[tool.setuptools.package-data]
tracecite_mobile = ["data/*.json", "platforms/android/perfetto/*.textproto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
